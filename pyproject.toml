[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heal-yield"
version = "0.1.0"
description = "A measurement harness for self-healing test loops: first-pass vs post-heal, every run, including the bad ones."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sahil Singh Diwan" }]
keywords = ["testing", "pytest", "llm", "test-generation", "benchmark", "coverage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pytest>=7.0",
  "pytest-reportlog>=0.4",
  "coverage[toml]>=7.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "black>=24.0"]

[project.scripts]
heal-yield = "heal_yield.cli:main"

[tool.setuptools]
packages = ["heal_yield", "heal_yield.generators"]

[tool.setuptools.package-data]
heal_yield = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
