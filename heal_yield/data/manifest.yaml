# Promoted from the bench only if a declared repo fails a dry run; the failure
# and the substitution are both recorded in the changelog.
reserve_bench:
  - markdown      # https://github.com/Python-Markdown/markdown
  - semver        # https://github.com/python-semver/python-semver
  - more-itertools
  - schema

policy:
  headline_average_over: headline   # anchors excluded, always
  repetitions: 5                    # never fewer, for any headline claim
  truncated_runs_may_be_a_headline_rep: false
  change_control: |
    Adding or repinning a repo is a minor version bump of this manifest with a
    changelog entry naming the reason. Removing a repo requires a stated reason,
    and that repo's last published numbers stay published.

excluded_and_why:
  - {name: chardet,  reason: platform-specific wheels — not pure Python}
  - {name: wrapt,    reason: platform-specific wheels — not pure Python}
  - {name: pytutils, reason: GPL — incompatible with quoting source in the runs repo}
