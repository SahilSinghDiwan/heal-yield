# heal-yield benchmark manifest — v1.0.0
# Declared 2026-09-14, BEFORE any run. Ticket 07.
#
# This file is the anti-cherry-picking mechanism. The full set is declared up
# front; v1 runs three of them and marks the rest "declared, not yet run".
# Changing this file is a versioned event — see `policy` at the bottom.

manifest_version: 1.0.0
declared: 2026-09-14

selection_criteria:
  - Pure-Python wheel (no compiled extension) — installs anywhere, no toolchain.
  - Test suite runs offline: no network, no services, no database, no credentials.
  - pytest-runnable (pytest collects unittest-style suites too).
  - Permissive license (MIT / BSD / Apache-2.0) — transcripts in the runs repo
    quote source, so copyleft is excluded.
  - Non-trivial logic; domains deliberately spread so no result is a genre artifact.
  - Pinned to the latest tagged release at manifest time, not to an arbitrary
    `main` HEAD — a tag is a point a reader can `pip download` and diff against.

module_selection_rule: |
  Applied identically to every repo; never hand-picked. Take the 5 source modules
  with the highest statement count, where a module is a .py file under the
  package root, excluding: __init__.py, __main__.py, anything matching
  _compat*/compat*/_version*/version*, anything under a tests/ or test/ path,
  and any module with fewer than 20 statements. Ties broken by path, ascending.
  Statement counts come from `coverage.py` on the pinned SHA. A reader can
  derive the exact module list from the SHA alone.

baseline_rule: |
  Before a run, the target module's existing tests are removed, and baseline
  coverage is measured without them. Every target therefore starts from the same
  place and heal yield is not confounded by how well-tested the package already
  was. This is NOT a claim to improve on the maintainers' suites.

