name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # ubuntu-latest is Ubuntu 26.04, and actions/setup-python publishes
          # no Python 3.9 build for it (3.9.25 exists for 22.04 and 24.04).
          # Keep 3.9 tested on the newest image that still has it.
          - python-version: "3.9"
            os: ubuntu-24.04
        exclude:
          - python-version: "3.9"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The whole suite is offline and runs against the fixture generator.
      # No API key is configured for CI, deliberately: a test that needs one
      # is a test that cannot be reproduced by a reader.
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check heal_yield tests
